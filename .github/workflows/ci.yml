name: Pinned Linux distribution checks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  distro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm-slim
            id: debian
            version: '12'
          - image: fedora:44
            id: fedora
            version: '44'
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Install distribution build packages
        env:
          EXPECTED_ID: ${{ matrix.id }}
          EXPECTED_VERSION: ${{ matrix.version }}
        run: |
          source /etc/os-release
          test "$ID" = "$EXPECTED_ID"
          test "$VERSION_ID" = "$EXPECTED_VERSION"
          cat /etc/os-release
          uname -a
          case "$ID" in
            debian)
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git g++ cmake ninja-build python3
              ;;
            fedora)
              dnf install -y git-core gcc-c++ glibc-static libstdc++-static cmake ninja-build python3
              ;;
          esac
          g++ --version
          cmake --version
          python3 --version
          getconf GNU_LIBC_VERSION
      - uses: actions/checkout@v7
        with:
          ref: 0b332f88343b0fdebf20a640a5c625a2132a521b
          persist-credentials: false
      - name: Build host tooling and compare its output with uname
        run: |
          git config --global --add safe.directory "$(pwd -P)"
          test "$(git rev-parse HEAD)" = 0b332f88343b0fdebf20a640a5c625a2132a521b
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DGTAVI_WARNINGS_AS_ERRORS=ON
          cmake --build build/host --parallel 4
          ctest --test-dir build/host --output-on-failure --no-tests=error --output-junit "$RUNNER_TEMP/host.xml"
          build/host/tools/gtavi_probe | tee "$RUNNER_TEMP/probe.txt"
          test "$(sed -n 's/^os version: *//p' "$RUNNER_TEMP/probe.txt")" = "$(uname -r)"
          test "$(sed -n 's/^architecture: *//p' "$RUNNER_TEMP/probe.txt")" = "$(uname -m)"
      - name: Build the pinned relinker and run synthetic fixtures
        run: |
          git config --global --add safe.directory "$(pwd -P)/third_party/AnyPS5"
          git submodule update --init --depth 1 third_party/AnyPS5
          test "$(git -C third_party/AnyPS5 rev-parse HEAD)" = "$(git rev-parse HEAD:third_party/AnyPS5)"
          git -C third_party/AnyPS5 rev-parse HEAD
          cmake -S third_party/AnyPS5 -B build/relinker -G Ninja -DCMAKE_BUILD_TYPE=Release -DANYPS5_RELINKER_ONLY=ON -DBUILD_TESTING=ON
          cmake --build build/relinker --parallel 4 --target relinker file_identity_tests relinker_conversion_tests
          ctest --test-dir build/relinker --output-on-failure --no-tests=error -R '^(cli_help|file_identity|input_magic|relinker_conversion)$' --output-junit "$RUNNER_TEMP/relinker.xml"
      - name: Verify exact test inventory
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          inventories = {
              "host": {"gtavi_tests", "gtavi_probe_mounts", "gtavi_probe_unicode"},
              "relinker": {"cli_help", "file_identity", "input_magic", "relinker_conversion"},
          }
          for suite, expected in inventories.items():
              cases = ET.parse(Path(os.environ["RUNNER_TEMP"]) / f"{suite}.xml").findall("testcase")
              assert {case.attrib["name"] for case in cases} == expected and len(cases) == len(expected)
              assert all(case.attrib.get("status") == "run" and all(case.find(tag) is None for tag in ("failure", "error", "skipped")) for case in cases)
              print(suite, sorted(expected))
          PY
