name: FAQ command verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  faq:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ca14e8f0952df3e389f3a31aa69c1e3fa491b3df
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test FAQ and Updates responses offline
        run: |
          git rev-parse HEAD
          python --version
          python -m pip install -r bot/requirements.txt
          python -m unittest discover -s bot -v
