name: Verify hourly contributions
on: workflow_dispatch
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - name: Compare event expressions with synthetic channel names
        env:
          OLD_push_none: ${{ 'push' == 'release' && fromJSON('{}').DISCORD_WEBHOOK_ANNOUNCEMENTS || fromJSON('{}').DISCORD_WEBHOOK_PROGRESS }}
          NEW_push_none: ${{ fromJSON('{}')['push' == 'release' && 'DISCORD_WEBHOOK_ANNOUNCEMENTS' || 'DISCORD_WEBHOOK_PROGRESS'] }}
          OLD_push_progress: ${{ 'push' == 'release' && fromJSON('{"DISCORD_WEBHOOK_PROGRESS":"progress"}').DISCORD_WEBHOOK_ANNOUNCEMENTS || fromJSON('{"DISCORD_WEBHOOK_PROGRESS":"progress"}').DISCORD_WEBHOOK_PROGRESS }}
          NEW_push_progress: ${{ fromJSON('{"DISCORD_WEBHOOK_PROGRESS":"progress"}')['push' == 'release' && 'DISCORD_WEBHOOK_ANNOUNCEMENTS' || 'DISCORD_WEBHOOK_PROGRESS'] }}
          OLD_push_announcements: ${{ 'push' == 'release' && fromJSON('{"DISCORD_WEBHOOK_ANNOUNCEMENTS":"announcements"}').DISCORD_WEBHOOK_ANNOUNCEMENTS || fromJSON('{"DISCORD_WEBHOOK_ANNOUNCEMENTS":"announcements"}').DISCORD_WEBHOOK_PROGRESS }}
          NEW_push_announcements: ${{ fromJSON('{"DISCORD_WEBHOOK_ANNOUNCEMENTS":"announcements"}')['push' == 'release' && 'DISCORD_WEBHOOK_ANNOUNCEMENTS' || 'DISCORD_WEBHOOK_PROGRESS'] }}
          OLD_push_both: ${{ 'push' == 'release' && fromJSON('{"DISCORD_WEBHOOK_PROGRESS":"progress","DISCORD_WEBHOOK_ANNOUNCEMENTS":"announcements"}').DISCORD_WEBHOOK_ANNOUNCEMENTS || fromJSON('{"DISCORD_WEBHOOK_PROGRESS":"progress","DISCORD_WEBHOOK_ANNOUNCEMENTS":"announcements"}').DISCORD_WEBHOOK_PROGRESS }}
          NEW_push_both: ${{ fromJSON('{"DISCORD_WEBHOOK_PROGRESS":"progress","DISCORD_WEBHOOK_ANNOUNCEMENTS":"announcements"}')['push' == 'release' && 'DISCORD_WEBHOOK_ANNOUNCEMENTS' || 'DISCORD_WEBHOOK_PROGRESS'] }}
          OLD_release_none: ${{ 'release' == 'release' && fromJSON('{}').DISCORD_WEBHOOK_ANNOUNCEMENTS || fromJSON('{}').DISCORD_WEBHOOK_PROGRESS }}
          NEW_release_none: ${{ fromJSON('{}')['release' == 'release' && 'DISCORD_WEBHOOK_ANNOUNCEMENTS' || 'DISCORD_WEBHOOK_PROGRESS'] }}
          OLD_release_progress: ${{ 'release' == 'release' && fromJSON('{"DISCORD_WEBHOOK_PROGRESS":"progress"}').DISCORD_WEBHOOK_ANNOUNCEMENTS || fromJSON('{"DISCORD_WEBHOOK_PROGRESS":"progress"}').DISCORD_WEBHOOK_PROGRESS }}
          NEW_release_progress: ${{ fromJSON('{"DISCORD_WEBHOOK_PROGRESS":"progress"}')['release' == 'release' && 'DISCORD_WEBHOOK_ANNOUNCEMENTS' || 'DISCORD_WEBHOOK_PROGRESS'] }}
          OLD_release_announcements: ${{ 'release' == 'release' && fromJSON('{"DISCORD_WEBHOOK_ANNOUNCEMENTS":"announcements"}').DISCORD_WEBHOOK_ANNOUNCEMENTS || fromJSON('{"DISCORD_WEBHOOK_ANNOUNCEMENTS":"announcements"}').DISCORD_WEBHOOK_PROGRESS }}
          NEW_release_announcements: ${{ fromJSON('{"DISCORD_WEBHOOK_ANNOUNCEMENTS":"announcements"}')['release' == 'release' && 'DISCORD_WEBHOOK_ANNOUNCEMENTS' || 'DISCORD_WEBHOOK_PROGRESS'] }}
          OLD_release_both: ${{ 'release' == 'release' && fromJSON('{"DISCORD_WEBHOOK_PROGRESS":"progress","DISCORD_WEBHOOK_ANNOUNCEMENTS":"announcements"}').DISCORD_WEBHOOK_ANNOUNCEMENTS || fromJSON('{"DISCORD_WEBHOOK_PROGRESS":"progress","DISCORD_WEBHOOK_ANNOUNCEMENTS":"announcements"}').DISCORD_WEBHOOK_PROGRESS }}
          NEW_release_both: ${{ fromJSON('{"DISCORD_WEBHOOK_PROGRESS":"progress","DISCORD_WEBHOOK_ANNOUNCEMENTS":"announcements"}')['release' == 'release' && 'DISCORD_WEBHOOK_ANNOUNCEMENTS' || 'DISCORD_WEBHOOK_PROGRESS'] }}
        run: |
          python3 - <<'PY'
          import os
          expected = {"OLD_push_none":"","NEW_push_none":"","OLD_push_progress":"progress","NEW_push_progress":"progress","OLD_push_announcements":"","NEW_push_announcements":"","OLD_push_both":"progress","NEW_push_both":"progress","OLD_release_none":"","NEW_release_none":"","OLD_release_progress":"progress","NEW_release_progress":"","OLD_release_announcements":"announcements","NEW_release_announcements":"announcements","OLD_release_both":"announcements","NEW_release_both":"announcements"}
          for key, value in expected.items():
              assert os.environ.get(key, "") == value, key
              print(key, repr(value))
          PY
  relinker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2e29cfcf48b1022c84e9dc6ddc02b1f22e5ecd84
          persist-credentials: false
      - name: Execute the documented shell block from the project root
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          section = Path("docs/build.md").read_text().split("### Building the pinned AnyPS5 relinker\n", 1)[1]
          script = section.split("```bash\n", 1)[1].split("\n```", 1)[0]
          result = subprocess.run(["bash", "-euxo", "pipefail", "-c", script], text=True,
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print(result.stdout, flush=True)
          result.check_returncode()
          assert "100% tests passed, 0 tests failed out of 4" in result.stdout
          for name in ("cli_help", "file_identity", "input_magic", "relinker_conversion"):
              assert re.search(r"\b" + name + r"\s+\.+\s+Passed\b", result.stdout)
          pinned = subprocess.check_output(["git", "rev-parse", "HEAD:third_party/AnyPS5"], text=True).strip()
          actual = subprocess.check_output(["git", "-C", "third_party/AnyPS5", "rev-parse", "HEAD"], text=True).strip()
          assert pinned == actual
          print("Verified AnyPS5", pinned)
          PY
