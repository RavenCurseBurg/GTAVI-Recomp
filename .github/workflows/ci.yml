name: CI

on: workflow_dispatch

permissions:
  contents: read

jobs:
  windows:
    name: Windows helper / baseline and fixed
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Configure a Windows build with tests disabled
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake -S . -B build/windows -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release -DGTAVI_BUILD_TESTS=OFF

      - name: Reproduce the old helper reporting success with zero tests
        shell: pwsh
        run: |
          git restore --source=HEAD~2 --worktree -- scripts/build-windows.bat
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select the unmodified helper' }
          & .\scripts\build-windows.bat Release
          if ($LASTEXITCODE -ne 0) { throw 'Expected the baseline to return success' }
          $list = ctest --test-dir build/windows -C Release --show-only=json-v1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $list.tests.Count -ne 0) { throw 'Expected an empty test inventory' }

      - name: Run the fixed helper against the same cache
        shell: pwsh
        run: |
          git restore --worktree -- scripts/build-windows.bat
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restore the fixed helper' }
          & .\scripts\build-windows.bat Release
          if ($LASTEXITCODE -ne 0) { throw 'The fixed helper failed' }
          $list = ctest --test-dir build/windows -C Release --show-only=json-v1 | ConvertFrom-Json
          $expected = @('gtavi_tests','gtavi_probe_mounts')
          if ($LASTEXITCODE -ne 0 -or (Compare-Object $expected @($list.tests.name))) {
            throw 'Did not find both project CTest entries'
          }
