name: CI

on: workflow_dispatch

permissions:
  contents: read

jobs:
  minimums:
    name: Ubuntu 22.04 / CMake 3.21.0 / GCC 11 and Clang 14
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7e541267da01e2a366c61982f1ed0d0fe270eede
          path: analysis
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 752e5bcdf6855ee5011ea33315d6476a90245ba9
          path: probe
          persist-credentials: false

      - name: Select the documented minimum tools
        run: |
          if ! command -v g++-11 || ! command -v clang++-14 || ! command -v clang-tidy-14; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends g++-11 clang-14 clang-tidy-14 ninja-build
          fi
          cd "$RUNNER_TEMP"
          archive=cmake-3.21.0-linux-x86_64.tar.gz
          curl -fsSL --retry 3 -o "$archive" "https://github.com/Kitware/CMake/releases/download/v3.21.0/$archive"
          echo "d54ef6909f519740bc85cec07ff54574cd1e061f9f17357d9ace69f61c6291ce  $archive" | sha256sum -c -
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/cmake-3.21.0-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build PR 11 using the documented analysis preset
        working-directory: analysis
        env:
          CXX: clang++-14
        run: |
          cat /etc/os-release
          clang++-14 --version
          clang-tidy-14 --version
          cmake --version
          test "$(cmake --version | head -n1)" = 'cmake version 3.21.0'
          git rev-parse HEAD
          cmake --preset ci -B build/tidy -DCMAKE_CXX_CLANG_TIDY=clang-tidy-14
          cmake --build build/tidy --parallel 2
          ctest --test-dir build/tidy --output-on-failure --no-tests=error

      - name: Exercise the native-release probe test with both compiler minimums
        working-directory: probe
        run: |
          git rev-parse HEAD
          g++-11 --version
          uname -r
          for compiler in g++-11 clang++-14; do
            dir="build/$compiler"
            CXX="$compiler" cmake --preset ci -B "$dir"
            cmake --build "$dir" --parallel 2
            ctest --test-dir "$dir" --output-on-failure --no-tests=error
          done
