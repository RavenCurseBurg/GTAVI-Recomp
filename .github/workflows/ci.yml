name: CI

on: workflow_dispatch

permissions:
  contents: read

jobs:
  audio_input:
    name: Pinned audio device, PCM and controller fixtures on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the runtime and its pinned dependencies
        run: |
          git submodule update --init --depth 1 third_party/AnyPS5
          git -C third_party/AnyPS5 submodule update --init --recursive --depth 1 --jobs 4
          echo "AnyPS5 $(git -C third_party/AnyPS5 rev-parse HEAD)"
          test "$(git -C third_party/AnyPS5 rev-parse HEAD)" = "$(git rev-parse HEAD:third_party/AnyPS5)"

      - name: Install the Linux build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build nasm pkg-config libx11-dev libxext-dev libxrandr-dev libasound2-dev
          g++-14 --version
          cmake --version

      - name: Build the audio and input fixtures at the pinned revision
        run: |
          cmake -G Ninja -S third_party/AnyPS5 -B build/fixtures -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DBUILD_TESTING=ON
          cmake --build build/fixtures --parallel 4 --target \
            audio_out_default_open_tests audio_out_vibration_device_tests \
            audio_out_vibration_tests audio_out_resampling_tests \
            pad_command_file_tests pad_recording_tests pad_input_script_tests

      - name: Run the synthetic cases and verify that all 27 executed
        run: |
          ctest --test-dir build/fixtures --no-tests=error --output-on-failure --timeout 120 --output-junit "$RUNNER_TEMP/fixtures.xml" \
            -R '^(audio_out_default_open_.*|audio_out_vibration_device_.*|audio_out_vibration_(s16|f32|batch_s16|batch_f32|mono_s16|mono_f32)|audio_out_resampling|pad_command_file|pad_recording|pad_input_script)$'
          python3 - "$RUNNER_TEMP/fixtures.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).findall("testcase")
          expected = {"audio_out_resampling", "pad_command_file", "pad_recording", "pad_input_script"}
          scenarios = {
              "audio_out_default_open_": "zero_default wasapi_zero_default no_endpoint positive unknown disconnect retry_absent retry_open retry_absent_multiple retry_open_multiple",
              "audio_out_vibration_device_": "quad pulse open_failure timing cadence discovery_failure disconnect",
              "audio_out_vibration_": "s16 f32 batch_s16 batch_f32 mono_s16 mono_f32",
          }
          for prefix, modes in scenarios.items():
              expected.update(prefix + mode for mode in modes.split())
          assert {case.attrib["name"] for case in cases} == expected and len(cases) == len(expected)
          assert all(case.find("skipped") is None and case.find("failure") is None and case.find("error") is None for case in cases)
          PY
