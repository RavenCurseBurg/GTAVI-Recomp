name: Verify pinned path and input mapping behavior
on: workflow_dispatch
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch the pinned source and runtime dependencies
        run: |
          git submodule update --init --depth 1 third_party/AnyPS5
          git -C third_party/AnyPS5 submodule update --init --depth 1 --recursive --jobs 4
          pin=$(git -C third_party/AnyPS5 rev-parse HEAD)
          test "$pin" = "$(git rev-parse HEAD:third_party/AnyPS5)"
          test "$pin" = 15826135019b8c7de27f42661a850a1dd9750932
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build nasm pkg-config libx11-dev libxext-dev libxrandr-dev libasound2-dev libpipewire-0.3-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev
      - name: Build the pinned filesystem and input fixtures
        run: |
          cmake -S third_party/AnyPS5 -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DBUILD_TESTING=ON
          cmake --build build/runtime --parallel 4 --target guest_path_case_tests pad_input_mapping_tests pad_keyboard_mouse_tests
      - name: Verify the fixture filesystem distinguishes ASCII case
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          with TemporaryDirectory(dir="build/runtime/core/libs/prx/libc") as temp:
              p = Path(temp)
              (p / "Settings.ini").write_text("x")
              assert not (p / "SETTINGS.INI").exists()
              (p / "SETTINGS.INI").write_text("z")
              assert (p / "Settings.ini").read_text() == "x"
              assert (p / "SETTINGS.INI").read_text() == "z"
              print("Same directory, distinct spellings and file contents")
          PY
      - name: Verify the guest path and input tests all run
        run: |
          ctest --test-dir build/runtime -V --no-tests=error --output-junit "$RUNNER_TEMP/cases.xml" -R '^(guest_path_case|pad_input_mapping|pad_keyboard_mouse)$'
          python3 - "$RUNNER_TEMP/cases.xml" <<'PY'
          import sys
          from xml.etree import ElementTree
          cases = ElementTree.parse(sys.argv[1]).findall("testcase")
          assert len(cases) == 3 and {c.get("name") for c in cases} == {"guest_path_case", "pad_input_mapping", "pad_keyboard_mouse"}
          for c in cases:
              assert c.get("status") == "run" and all(c.find(tag) is None for tag in ("failure", "error", "skipped"))
              print(c.get("name"), c.get("status"), c.get("time"))
          PY
