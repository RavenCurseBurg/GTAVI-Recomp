name: Pinned DualSense controller output fixtures

on: workflow_dispatch

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0b332f88343b0fdebf20a640a5c625a2132a521b
          persist-credentials: false

      - name: Fetch the pinned runtime source
        run: |
          git submodule update --init --depth 1 third_party/AnyPS5
          git -C third_party/AnyPS5 submodule update --init --depth 1 --recursive --jobs 4
          pin=$(git -C third_party/AnyPS5 rev-parse HEAD)
          echo "AnyPS5 $pin"
          test "$pin" = "$(git rev-parse HEAD:third_party/AnyPS5)"
          test "$pin" = 15826135019b8c7de27f42661a850a1dd9750932

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build nasm pkg-config \
            libx11-dev libxext-dev libxrandr-dev libasound2-dev libvulkan1 mesa-vulkan-drivers \
            libpipewire-0.3-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev
          g++-14 --version
          cmake --version
          ninja --version
          uname -m
          getconf GNU_LIBC_VERSION
          nproc
          free -h
          df -h .

      - name: Build the two controller output fixtures
        run: |
          cmake -S third_party/AnyPS5 -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DBUILD_TESTING=ON
          cmake --build build/runtime --parallel 4 --target guest_pad_trigger_effects_tests dualsense_haptics_tests

      - name: Check generated trigger commands and Bluetooth haptics reports
        run: |
          ctest --test-dir build/runtime --no-tests=error --verbose --timeout 60 --test-output-size-passed 16384 \
            --output-junit "$RUNNER_TEMP/controller.xml" -R '^(guest_pad_trigger_effects|dualsense_haptics)$'
          python3 - "$RUNNER_TEMP/controller.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          expected = {
              "guest_pad_trigger_effects": "guest pad trigger effects tests passed",
              "dualsense_haptics": "dualsense haptics tests passed",
          }
          cases = ET.parse(sys.argv[1]).findall("testcase")
          assert len(cases) == len(expected) and {c.get("name") for c in cases} == set(expected)
          for case in cases:
              assert case.get("status") == "run"
              assert all(case.find(tag) is None for tag in ("skipped", "error", "failure"))
              assert expected[case.get("name")] in case.findtext("system-out", "")
          PY
