name: CI

on: workflow_dispatch

permissions:
  contents: read

jobs:
  developer-shell:
    name: Compare the Windows shell setup for manual Ninja builds
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a92807b621bcf38fa692ed29d6bda3fe4ca5e21
          persist-credentials: false

      - name: Check the environment after calling vcvars64.bat from plain PowerShell
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $batch = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (Get-Command cl.exe -ErrorAction SilentlyContinue) { throw 'Expected a plain PowerShell session' }
          & $batch
          if ($LASTEXITCODE -ne 0) { throw 'The installed vcvars64.bat failed to initialize' }
          if ((Get-Command cl.exe -ErrorAction SilentlyContinue) -or $env:VCToolsInstallDir) { throw 'The child batch environment unexpectedly persisted' }
          'vcvars64.bat succeeded; cl.exe remains absent in the parent PowerShell.'
          "GTAVI_VCVARS=$batch" >> $env:GITHUB_ENV
          $scriptPath = Join-Path $env:RUNNER_TEMP 'gtavi-manual-build.ps1'
          "GTAVI_BUILD_SCRIPT=$scriptPath" >> $env:GITHUB_ENV
          $guide = (Get-Content -LiteralPath docs/build.md -Raw).Replace("`r`n", "`n")
          $commands = @('cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug', 'cmake --build build', 'ctest --test-dir build --output-on-failure')
          if (!$guide.Contains(($commands -join "`n"))) { throw 'The guide has changed' }
          $check = @(
            '$ErrorActionPreference = "Stop"',
            'if ($env:VSCMD_ARG_TGT_ARCH -ne "x64" -or !$env:WindowsSdkDir) { throw "Missing x64 SDK environment" }',
            '(Get-Command cl.exe).Source',
            'git rev-parse HEAD'
          )
          foreach ($command in $commands) { $check += $command; $check += 'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }' }
          Set-Content -LiteralPath $scriptPath -Encoding ascii -Value $check

      - name: Start Windows PowerShell in the initialized x64 prompt and build
        shell: cmd
        run: |
          call "%GTAVI_VCVARS%" || exit /b 1
          powershell -NoLogo -NoProfile -NonInteractive -File "%GTAVI_BUILD_SCRIPT%"
