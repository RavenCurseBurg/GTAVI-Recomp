name: CI

on: workflow_dispatch

permissions:
  contents: read

jobs:
  filesystem:
    name: Pinned AnyPS5 filesystem fixtures on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the runtime and its pinned dependencies
        run: |
          git submodule update --init --depth 1 third_party/AnyPS5
          git -C third_party/AnyPS5 submodule update --init --recursive --depth 1 --jobs 4
          echo "AnyPS5 $(git -C third_party/AnyPS5 rev-parse HEAD)"
          test "$(git -C third_party/AnyPS5 rev-parse HEAD)" = "$(git rev-parse HEAD:third_party/AnyPS5)"

      - name: Install the Linux build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build nasm pkg-config libx11-dev libxext-dev libxrandr-dev libasound2-dev
          g++-14 --version
          cmake --version

      - name: Build four test executables and their runtime dependencies
        run: |
          cmake -G Ninja -S third_party/AnyPS5 -B build/fs -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DBUILD_TESTING=ON
          cmake --build build/fs --parallel 4 --target guest_filesystem_tests guest_file_timestamp_tests guest_file_vector_tests download_data_mount_tests

      - name: Run the nine filesystem cases and verify the inventory
        run: |
          ctest --test-dir build/fs --no-tests=error --output-on-failure --timeout 120 --output-junit "$RUNNER_TEMP/filesystem.xml" -R '^(guest_filesystem|guest_file_timestamps|guest_file_vector|download_data_mount_.*)$'
          python3 - "$RUNNER_TEMP/filesystem.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).findall("testcase")
          expected = {"guest_filesystem", "guest_file_timestamps", "guest_file_vector"}
          expected.update("download_data_mount_" + scenario for scenario in ("declared", "none", "invalid", "missing", "sfo", "blocked"))
          assert {case.attrib["name"] for case in cases} == expected and len(cases) == len(expected)
          assert all(case.find("skipped") is None and case.find("failure") is None and case.find("error") is None for case in cases)
          PY
