name: Pinned offscreen color and depth fixtures

on: workflow_dispatch

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0b332f88343b0fdebf20a640a5c625a2132a521b
          persist-credentials: false

      - name: Fetch the pinned runtime source
        run: |
          git submodule update --init --depth 1 third_party/AnyPS5
          git -C third_party/AnyPS5 submodule update --init --depth 1 --recursive --jobs 4
          pin=$(git -C third_party/AnyPS5 rev-parse HEAD)
          echo "AnyPS5 $pin"
          test "$pin" = "$(git rev-parse HEAD:third_party/AnyPS5)"
          test "$pin" = 15826135019b8c7de27f42661a850a1dd9750932

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build nasm pkg-config \
            libx11-dev libxext-dev libxrandr-dev libasound2-dev libvulkan1 mesa-vulkan-drivers vulkan-tools \
            libpipewire-0.3-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev
          g++-14 --version
          cmake --version
          ninja --version
          uname -m
          getconf GNU_LIBC_VERSION
          nproc
          free -h
          df -h .

      - name: Select the Mesa CPU Vulkan driver
        run: |
          icd=$(dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd(\.x86_64)?\.json$')
          test -f "$icd"
          export VK_DRIVER_FILES="$icd"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          vulkaninfo --summary | tee "$RUNNER_TEMP/vulkan-summary.txt"
          grep -Ei 'deviceName\s*=.*llvmpipe' "$RUNNER_TEMP/vulkan-summary.txt"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

      - name: Build the color and depth rendering fixtures
        run: |
          cmake -S third_party/AnyPS5 -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DBUILD_TESTING=ON
          cmake --build build/runtime --parallel 4 --target agc_driver_color565_target_tests \
            agc_driver_color_write_mask_dynamic_tests agc_driver_depth_range_remap_draw_tests

      - name: Draw and check sample colors and depth
        env:
          ANYPS5_REQUIRE_VULKAN: "1"
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: |
          ctest --test-dir build/runtime --verbose --timeout 120 --no-tests=error --test-output-size-passed 262144 \
            --output-junit "$RUNNER_TEMP/rendering.xml" \
            -R '^agc_driver_(color565_target|color_write_mask_dynamic(_in_pipeline|_unsuppressed)?|depth_range_remap_draw)$'
          python3 - "$RUNNER_TEMP/rendering.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          expected = {
              "agc_driver_color565_target": "44 draws plus 24 constant-blend draws passed",
              "agc_driver_color_write_mask_dynamic": "color write mask tests passed",
              "agc_driver_color_write_mask_dynamic_in_pipeline": "color write mask tests passed",
              "agc_driver_color_write_mask_dynamic_unsuppressed": "color write mask tests passed",
              "agc_driver_depth_range_remap_draw": "depth range remap draw tests passed",
          }
          cases = ET.parse(sys.argv[1]).findall("testcase")
          assert len(cases) == len(expected) and {c.get("name") for c in cases} == set(expected)
          for case in cases:
              assert case.get("status") == "run"
              assert all(case.find(tag) is None for tag in ("skipped", "failure", "error"))
              needle = expected[case.get("name")]
              lines = case.findtext("system-out", "").splitlines()
              assert any(needle in line for line in lines), (case.get("name"), lines[-10:])
          PY
