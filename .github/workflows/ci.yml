name: Verify pinned file modes and PCM channel layouts
on: workflow_dispatch
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch the pinned source and runtime dependencies
        run: |
          git submodule update --init --depth 1 third_party/AnyPS5
          git -C third_party/AnyPS5 submodule update --init --depth 1 --recursive --jobs 4
          pin=$(git -C third_party/AnyPS5 rev-parse HEAD)
          test "$pin" = "$(git rev-parse HEAD:third_party/AnyPS5)"
          test "$pin" = 15826135019b8c7de27f42661a850a1dd9750932
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build nasm pkg-config libx11-dev libxext-dev libxrandr-dev libasound2-dev libpipewire-0.3-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev
      - name: Build the fixtures
        run: |
          printf '\ninclude("%s/verification/regular_file_mode.cmake")\n' "$GITHUB_WORKSPACE" >> third_party/AnyPS5/core/libs/prx/libkernel/CMakeLists.txt
          cmake -S third_party/AnyPS5 -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DBUILD_TESTING=ON
          cmake --build build/runtime --parallel 4 --target project_regular_file_mode audio_out_buffer_size_tests audio_out2_port_layouts_tests
      - name: Measure regular file modes and compare synthetic PCM samples
        run: |
          set -o pipefail
          ctest --test-dir build/runtime -V --no-tests=error --output-junit "$RUNNER_TEMP/report.xml" -R '^(project_regular_file_mode|audio_out_buffer_size_pass_through|audio_out2_port_layouts)$'
          python3 - "$RUNNER_TEMP/report.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).findall("testcase")
          assert len(cases) == 3 and {c.get("name") for c in cases} == {"project_regular_file_mode","audio_out_buffer_size_pass_through","audio_out2_port_layouts"}
          for c in cases:
              assert c.get("status") == "run" and all(c.find(x) is None for x in ("skipped","failure","error"))
              print(c.get("name"), c.get("status"), c.get("time"))
          PY
