name: Verify pinned cancellation and Audio3d fixtures
on: workflow_dispatch
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch the pinned source and runtime dependencies
        run: |
          git submodule update --init --depth 1 third_party/AnyPS5
          git -C third_party/AnyPS5 submodule update --init --depth 1 --recursive --jobs 4
          pin=$(git -C third_party/AnyPS5 rev-parse HEAD)
          test "$pin" = "$(git rev-parse HEAD:third_party/AnyPS5)"
          test "$pin" = 15826135019b8c7de27f42661a850a1dd9750932
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build nasm pkg-config libx11-dev libxext-dev libxrandr-dev libasound2-dev libpipewire-0.3-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev
      - name: Build cancellation and Audio3d fixtures
        run: |
          cmake -S third_party/AnyPS5 -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DBUILD_TESTING=ON
          cmake --build build/runtime --parallel 4 --target guest_pthread_cancel_tests guest_sleep_cancel_tests guest_audio3d_mixer_tests guest_audio3d_port_tests
      - name: Run six pinned cases
        run: |
          ctest --test-dir build/runtime --verbose --no-tests=error --output-junit "$RUNNER_TEMP/cases.xml" -R '^(guest_pthread_cancel|guest_sleep_cancel_nanosleep_blocked|guest_sleep_cancel_nanosleep_disabled|guest_sleep_cancel_sce_nanosleep_deferred|guest_audio3d_mixer|guest_audio3d_port)$'
          python3 - "$RUNNER_TEMP/cases.xml" <<'PY'
          import sys
          from xml.etree import ElementTree
          cases = ElementTree.parse(sys.argv[1]).findall("testcase")
          expected = set("guest_pthread_cancel guest_sleep_cancel_nanosleep_blocked guest_sleep_cancel_nanosleep_disabled guest_sleep_cancel_sce_nanosleep_deferred guest_audio3d_mixer guest_audio3d_port".split())
          assert len(cases) == len(expected) and {case.get("name") for case in cases} == expected
          for case in cases:
              assert case.get("status") == "run" and all(case.find(tag) is None for tag in ("failure", "error", "skipped"))
              print(case.get("name"), case.get("status"), case.get("time"))
          PY
