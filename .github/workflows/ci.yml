name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        # No -G: use whichever Visual Studio the runner image provides. The
        # generator name changes between runner images, the default does not.
        run: >
          cmake -S . -B build
          -A x64
          -DGTAVI_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux:
    name: linux / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTAVI_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  anyps5:
    name: anyps5 relinker at the pinned commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch AnyPS5 at the pinned commit
        # AnyPS5's own submodules are not needed for the relinker-only mode
        # (third_party/AnyPS5/docs/dev/BUILD.md), so only the submodule
        # itself is checked out.
        run: git submodule update --init third_party/AnyPS5

      - name: Configure
        run: >
          cmake -S third_party/AnyPS5 -B build-anyps5
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DANYPS5_RELINKER_ONLY=ON
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-anyps5 --parallel

      - name: Test
        run: >
          ctest --test-dir build-anyps5 --output-on-failure
          --timeout 120 --parallel 4 --no-tests=error

  app0:
    name: PS5 app0 preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the app0 checker
        run: python3 -I tests/test_check_app0.py

  progress:
    name: readme progress is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the progress tooling
        run: python3 -m unittest discover -s tests/python -v

      - name: Check README progress section
        run: python3 scripts/update_progress.py --check
