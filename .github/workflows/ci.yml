name: Native probe ARM64 verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm, macos-26]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d412d89f93400b129d37fdbb75ce218ea75d70bd
          persist-credentials: false
      - name: Configure Windows ARM64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'Expected an ARM64 host' }
          cmake -S . -B build -A ARM64 -DGTAVI_WARNINGS_AS_ERRORS=ON
      - name: Configure native POSIX build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          uname -a
          case "$(uname -m)" in arm64|aarch64) ;; *) exit 1 ;; esac
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGTAVI_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --config Release --parallel 4
      - name: Run native host and Unicode tests
        shell: bash
        run: |
          set -eu
          ctest --test-dir build -C Release -N > cases.txt
          cat cases.txt
          grep -F 'Total Tests: 4' cases.txt
          if [ "$RUNNER_OS" = macOS ]; then
            grep -F gtavi_probe_unsupported_host cases.txt
          else
            grep -F gtavi_probe_host_release cases.txt
          fi
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - uses: actions/checkout@v7
        if: runner.os == 'macOS'
        with:
          ref: c1ab0d27cc09c4737ccdbca9bff73a7a5a5b0dc9
          path: before
          persist-credentials: false
      - name: Reproduce the original translation status on Apple silicon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          sw_vers
          cmake -S before -B old-build -G Ninja -DGTAVI_BUILD_TESTS=OFF
          cmake --build old-build --target gtavi_probe --parallel 4
          status=0
          ./old-build/tools/gtavi_probe --to-posix 'D:\Music' > before-output.txt 2> before-errors.txt || status=$?
          test "$status" = 1
          grep -F '/mnt/d/Music' before-output.txt
          ./build/tools/gtavi_probe --to-posix 'D:\Music' > after-output.txt 2> after-errors.txt
          grep -F '/mnt/d/Music' after-output.txt
