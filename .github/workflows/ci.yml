name: CI

on: workflow_dispatch

permissions:
  contents: read

jobs:
  developer-shell:
    name: Compare the Windows shell setup for manual Ninja builds
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3f087def85c9b121f093242e679c6a4e48b68169
          persist-credentials: false

      - name: Check the environment after calling vcvars64.bat from plain PowerShell
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $batch = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (Get-Command cl.exe -ErrorAction SilentlyContinue) { throw 'Expected a plain PowerShell session' }
          & $batch
          if ($LASTEXITCODE -ne 0) { throw 'The installed vcvars64.bat failed to initialize' }
          if ((Get-Command cl.exe -ErrorAction SilentlyContinue) -or $env:VCToolsInstallDir) { throw 'The child batch environment unexpectedly persisted' }
          'vcvars64.bat succeeded; cl.exe remains absent in the parent PowerShell.'
          "GTAVI_VCVARS=$batch" >> $env:GITHUB_ENV
          $scriptPath = Join-Path $env:RUNNER_TEMP 'gtavi-manual-build.ps1'
          "GTAVI_BUILD_SCRIPT=$scriptPath" >> $env:GITHUB_ENV
          $guide = (Get-Content -LiteralPath docs/build.md -Raw).Replace("`r`n", "`n")
          $commands = @('cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug', 'cmake --build build', 'ctest --test-dir build --output-on-failure')
          if (!$guide.Contains(($commands -join "`n"))) { throw 'The guide has changed' }
          $check = @(
            '$ErrorActionPreference = "Stop"',
            'if ($env:VSCMD_ARG_TGT_ARCH -ne "x64" -or !$env:WindowsSdkDir) { throw "Missing x64 SDK environment" }',
            '(Get-Command cl.exe).Source',
            'git rev-parse HEAD'
          )
          foreach ($command in $commands) { $check += $command; $check += 'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }' }
          Set-Content -LiteralPath $scriptPath -Encoding ascii -Value $check

      - name: Start Windows PowerShell in the initialized x64 prompt and build
        shell: cmd
        run: |
          call "%GTAVI_VCVARS%" || exit /b 1
          powershell -NoLogo -NoProfile -NonInteractive -File "%GTAVI_BUILD_SCRIPT%"

      - name: Run the documented Ninja output from the repository root
        shell: pwsh
        run: |
          $guide = Get-Content -LiteralPath docs/build.md -Raw
          if (!$guide.Contains('./build/tools/gtavi_probe --mount D:/games')) { throw 'Guide path changed' }
          $lines = ./build/tools/gtavi_probe --mount D:/games --to-posix "D:\PS5\app0" --to-windows /games/PS5/app0
          if ($LASTEXITCODE -or $lines -notcontains 'D:\PS5\app0 -> /games/PS5/app0' -or $lines -notcontains '/games/PS5/app0 -> D:\PS5\app0') { throw 'Ninja probe mismatch' }
          $lines

      - name: Build with the Release helper and compare the probe to Windows
        shell: pwsh
        run: |
          $helper = Join-Path $env:GITHUB_WORKSPACE 'scripts\build-windows.bat'
          Push-Location -LiteralPath $env:RUNNER_TEMP
          try {
            & $helper Release
            if ($LASTEXITCODE) { throw "Build helper exited $LASTEXITCODE" }
          } finally { Pop-Location }
          $cache = Get-Content -LiteralPath 'build/windows/CMakeCache.txt'
          foreach ($entry in 'CMAKE_GENERATOR:INTERNAL=Ninja','CMAKE_BUILD_TYPE:STRING=Release','GTAVI_WARNINGS_AS_ERRORS:BOOL=ON') {
            if ($cache -notcontains $entry) { throw "Missing cache setting $entry" }
          }
          $windows = Get-CimInstance Win32_OperatingSystem
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          "$($windows.Caption) / $($windows.Version) / $arch"
          if ($windows.Caption -notmatch 'Server 2022' -or $arch -ne 'X64') { throw 'Unexpected host' }
          $lines = & '.\build\windows\tools\gtavi_probe.exe'
          if ($LASTEXITCODE -or $lines -notcontains 'platform:     windows' -or $lines -notcontains "os version:   $($windows.Version)" -or $lines -notcontains 'architecture: x86_64') { throw "Host facts disagree: $lines" }
          $lines

  visual-studio:
    name: Use the default Visual Studio generator from plain PowerShell
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3f087def85c9b121f093242e679c6a4e48b68169
          persist-credentials: false
      - shell: pwsh
        run: |
          $guide = (Get-Content -LiteralPath docs/build.md -Raw).Replace("`r`n", "`n")
          $commands = @('cmake -S . -B build -A x64','cmake --build build --config Debug','ctest --test-dir build -C Debug --output-on-failure')
          if (!$guide.Contains(($commands -join "`n")) -or !$guide.Contains('.\build\tools\Debug\gtavi_probe.exe')) { throw 'Guide commands changed' }
          cmake -S . -B build -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Debug
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build -C Debug --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = .\build\tools\Debug\gtavi_probe.exe --to-posix "C:\Games\GTA VI\data" --to-windows /mnt/c/Games
          if ($LASTEXITCODE -or $lines -notcontains 'C:\Games\GTA VI\data -> /mnt/c/Games/GTA VI/data' -or $lines -notcontains '/mnt/c/Games -> C:\Games') { throw 'Visual Studio probe mismatch' }
          $lines
