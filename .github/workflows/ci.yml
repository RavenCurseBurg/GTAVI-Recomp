name: Pinned Linux runtime inventory

on: workflow_dispatch

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0b332f88343b0fdebf20a640a5c625a2132a521b
          persist-credentials: false

      - name: Fetch the pinned runtime source
        run: |
          git submodule update --init --depth 1 third_party/AnyPS5
          git -C third_party/AnyPS5 submodule update --init --depth 1 --recursive --jobs 4
          pin=$(git -C third_party/AnyPS5 rev-parse HEAD)
          echo "AnyPS5 $pin"
          test "$pin" = "$(git rev-parse HEAD:third_party/AnyPS5)"
          test "$pin" = 15826135019b8c7de27f42661a850a1dd9750932

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build nasm pkg-config \
            libx11-dev libxext-dev libxrandr-dev libasound2-dev libvulkan1 mesa-vulkan-drivers \
            libpipewire-0.3-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev
          g++-14 --version
          cmake --version
          ninja --version
          uname -m
          getconf GNU_LIBC_VERSION
          nproc
          free -h
          df -h .

      - name: Configure the Release build
        run: |
          cmake -S third_party/AnyPS5 -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DBUILD_TESTING=ON
          ninja -C build/runtime -n patched_libraries_tests | tail -n 1

      - name: Build the loader test and all its runtime libraries
        run: cmake --build build/runtime --parallel 4 --target patched_libraries_tests

      - name: Compare the ELF library inventory with the pinned sources
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          root = Path("third_party/AnyPS5/core/libs/prx")
          expected = {d.name + ".prx" for d in root.iterdir() if d.is_dir()}
          library_dir = Path("build/runtime/core/libs/libs")
          files = sorted(library_dir.glob("*.prx"))
          actual = {path.name for path in files}
          if not expected or actual != expected:
              raise SystemExit(f"missing={sorted(expected - actual)} extra={sorted(actual - expected)}")
          for path in files:
              with path.open("rb") as stream:
                  header = stream.read(20)
              if header[:6] != b"\x7fELF\x02\x01" or struct.unpack_from("<HH", header, 16) != (3, 62):
                  raise SystemExit(f"{path} is not a little-endian x86_64 ELF shared object")
          print(f"Matched all {len(actual)} pinned source names to x86_64 ELF shared objects")
          PY

      - name: Load every patched runtime library
        run: |
          ctest --test-dir build/runtime -R '^patched_libraries$' --verbose --timeout 180 \
            --no-tests=error --output-junit "$RUNNER_TEMP/patched.xml"
          python3 - "$RUNNER_TEMP/patched.xml" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).findall("testcase")
          assert len(cases) == 1
          case = cases[0]
          assert case.attrib["name"] == "patched_libraries" and case.attrib["status"] == "run"
          assert all(case.find(tag) is None for tag in ("failure", "error", "skipped"))
          count = len(list(Path("build/runtime/core/libs/libs").glob("*.prx")))
          output = case.findtext("system-out", "")
          assert f"{count} patched libraries loaded, 0 failed" in output, output
          print(output.strip())
          PY
